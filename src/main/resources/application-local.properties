spring.config.import=optional:file:./config/sqlserver-local.properties
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=reto_db;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=${MSSQL_SA_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.batch.jdbc.initialize-schema=never
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-sqlserver.sql,classpath:db/batch-sqlserver.sql
spring.sql.init.separator=^^^
